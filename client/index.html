<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Split bills dish by dish, and settle up with the fewest payments." />
    <!-- Two values so the browser chrome matches whichever theme is showing. -->
    <meta name="theme-color" content="#f7f1e4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Splitwise" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231cc29f'/%3E%3Cpath d='M16 6v20M11 11h7.5a3.5 3.5 0 0 1 0 7h-5a3.5 3.5 0 0 0 0 7H21' stroke='white' stroke-width='2.5' stroke-linecap='round' fill='none'/%3E%3C/svg%3E"
    />
    <title>Splitwise</title>
  </head>
  <body>
    <script>
      /*
       * Set the theme before the first paint. Doing this in React instead would
       * render one frame of light mode and then flip, which is the flash of
       * white every dark-mode user notices.
       */
      (function () {
        try {
          var stored = localStorage.getItem('sw-theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* private mode with storage blocked: fall back to light */
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
